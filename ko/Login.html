<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<base href="../" />
<title>로그인 — FPP v2</title>
<meta name="description" content="FPP v2 로그인 / 회원가입" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#0a1626" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="FPP" />
<link rel="apple-touch-icon" href="img/pwa-icon-180.png" />
<link rel="icon" type="image/png" href="img/logo-light.png" />
<script>
/* 테마 저장값(JSON 문자열)을 파싱해 정규화 — 따옴표 포함 값이 data-theme에 들어가 CSS 변수가 늦게 적용되던 문제 수정 */
(function(){try{var t=localStorage.getItem('fpp_theme');if(t){try{t=JSON.parse(t);}catch(e){}document.documentElement.setAttribute('data-theme',t==='light'?'light':'dark');}}catch(e){}})();
</script>
<style>
/* 페이지 전환 시 흰 화면 깜빡임 방지 — CSS 로드 전에도 테마 배경 즉시 적용 */
html{background:#0a1626;color-scheme:dark}
html[data-theme="light"]{background:#eef3f8;color-scheme:light}
/* 페이지 전환 베일 — 스타일시트가 적용되는 즉시 빠르게 해제, 폴백은 .9초 후 강제 해제 */
.page-veil{position:fixed;inset:0;z-index:9999;pointer-events:none;background:#0a1626;opacity:1;transition:opacity .25s ease;animation:pageVeilFail .3s ease .9s forwards}
html[data-theme="light"] .page-veil{background:#eef3f8}
.page-veil.off{opacity:0}
@keyframes pageVeilFail{to{opacity:0;visibility:hidden}}
</style>
<link rel="stylesheet" href="css/common.css" />
<link rel="stylesheet" href="css/Login.css" />
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
<script src="js/sdk.js"></script>
</head>
<body data-page="login" class="login-page">

<div id="pageVeil" class="page-veil" aria-hidden="true"></div>
<div class="ambient" aria-hidden="true"></div>

<main class="login-stage">
  <a class="login-back" href="ko/Main.html#home" aria-label="뒤로가기">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
  </a>
  <a class="login-logo" href="ko/Main.html" aria-label="FPP 홈으로">
    <span class="login-logo-mark" aria-hidden="true">
      <img class="login-logo-image login-logo-image--dark" src="img/logo-dark.png" alt="FP Patch 로고" />
      <img class="login-logo-image login-logo-image--light" src="img/logo-light.png" alt="" />
    </span>
    <span class="login-logo-txt">FPP</span>
  </a>

  <h1 class="login-title" id="loginTitle">로그인</h1>
  <p class="login-sub" id="loginSub">그랜드 라인 항해 기록에 오신 것을 환영합니다</p>

  <!-- ===== 로그인 폼 ===== -->
  <section class="login-card rv" id="formLogin">
    <label class="fld">
       <span class="fld-lb fld-lb--desktop">아이디 (이메일)</span>
       <span class="fld-lb fld-lb--mobile">이메일</span>
       <div class="login-input-wrap">
         <input id="liEmail" type="email" autocomplete="username" placeholder="" />
         <button class="login-input-action login-input-clear" type="button" aria-label="이메일 지우기">
           <i class="ic-v2-control-close-circle-fill" aria-hidden="true"></i>
         </button>
       </div>
    </label>
    <label class="fld">
      <span class="fld-lb">비밀번호</span>
       <div class="login-input-wrap has-password-toggle">
         <input id="liPw" type="password" autocomplete="current-password" placeholder="" />
         <button class="login-input-action password-toggle" type="button" data-password-target="liPw" aria-label="비밀번호 표시" aria-pressed="false">
           <i class="password-toggle-icon ic-v2-community-number-of-view-fill" aria-hidden="true"></i>
         </button>
         <button class="login-input-action login-input-clear" type="button" aria-label="비밀번호 지우기">
           <i class="ic-v2-control-close-circle-fill" aria-hidden="true"></i>
         </button>
       </div>
    </label>
    <button class="btn btn--gold btn--block" id="btnLogin" type="button">로그인</button>
    <div class="login-links">
      <button class="lk" id="btnFind" type="button">
        <span class="login-find-label login-find-label--desktop">로그인 정보 찾기</span>
        <span class="login-find-label login-find-label--mobile">로그인 정보 찾기</span>
      </button>
      <button class="lk" id="btnToSignup" type="button">회원가입</button>
    </div>
    <div class="or-line"><span>또는</span></div>
    <button class="btn btn--google btn--block" id="btnGoogle1" type="button">
      <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 5.9 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 5.9 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.4-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C36.9 40.4 44 35 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Google 로그인
    </button>
  </section>

  <!-- ===== 회원가입 초기 화면 ===== -->
  <section class="login-card rv" id="formSignupIntro" hidden>
    <button class="btn btn--gold btn--block" id="btnEmailSignup" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3.5 7l8.5 6 8.5-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
       이메일 회원가입
    </button>
    <div class="or-line"><span>또는</span></div>
    <button class="btn btn--google btn--block" id="btnGoogle2" type="button">
      <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 5.9 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.1 18.9 12 24 12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 5.9 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.4-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.1 5.7l6.2 5.2C36.9 40.4 44 35 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
       Google 회원가입
    </button>
    <div class="login-links login-links--center">
      <button class="lk" id="btnToLogin" type="button">이미 계정이 있으신가요? 로그인</button>
    </div>
  </section>

  <!-- ===== 이메일 회원가입 폼 ===== -->
  <section class="login-card rv" id="formSignup" hidden>
    <label class="fld"><span class="fld-lb">아이디 (이메일)</span>
      <div class="login-input-wrap">
        <input id="suEmail" type="email" autocomplete="email" placeholder="" />
        <button class="login-input-action login-input-clear" type="button" aria-label="이메일 지우기">
          <i class="ic-v2-control-close-circle-fill" aria-hidden="true"></i>
        </button>
      </div></label>
    <label class="fld"><span class="fld-lb">비밀번호</span>
      <div class="login-input-wrap has-password-toggle">
        <input id="suPw" type="password" autocomplete="new-password" placeholder="" />
        <button class="login-input-action password-toggle" type="button" data-password-target="suPw" aria-label="비밀번호 표시" aria-pressed="false">
          <i class="password-toggle-icon ic-v2-community-number-of-view-fill" aria-hidden="true"></i>
        </button>
        <button class="login-input-action login-input-clear" type="button" aria-label="비밀번호 지우기">
          <i class="ic-v2-control-close-circle-fill" aria-hidden="true"></i>
        </button>
      </div></label>
    <label class="fld"><span class="fld-lb">비밀번호 확인</span>
      <div class="login-input-wrap has-password-toggle">
        <input id="suPw2" type="password" autocomplete="new-password" placeholder="" />
        <button class="login-input-action password-toggle" type="button" data-password-target="suPw2" aria-label="비밀번호 표시" aria-pressed="false">
          <i class="password-toggle-icon ic-v2-community-number-of-view-fill" aria-hidden="true"></i>
        </button>
        <button class="login-input-action login-input-clear" type="button" aria-label="비밀번호 확인 지우기">
          <i class="ic-v2-control-close-circle-fill" aria-hidden="true"></i>
        </button>
      </div></label>
    <label class="fld"><span class="fld-lb">닉네임</span>
      <div class="login-input-wrap">
        <input id="suNick" type="text" maxlength="16" placeholder="" />
        <button class="login-input-action login-input-clear" type="button" aria-label="닉네임 지우기">
          <i class="ic-v2-control-close-circle-fill" aria-hidden="true"></i>
        </button>
      </div></label>
    <div class="fld">
      <span class="fld-lb">이메일 인증번호</span>
      <div class="fld-row">
        <div class="login-input-wrap">
          <input id="suCode" type="text" inputmode="numeric" maxlength="6" placeholder="" />
          <button class="login-input-action login-input-clear" type="button" aria-label="인증번호 지우기">
            <i class="ic-v2-control-close-circle-fill" aria-hidden="true"></i>
          </button>
        </div>
        <button class="btn btn--ghost btn--sm" id="btnSendCode" type="button">인증 전송</button>
      </div>
      <p class="fld-hint" id="codeHint">가입 전 이메일 인증이 필요합니다. 인증 전송을 눌러주세요.</p>
    </div>
    <button class="btn btn--gold btn--block" id="btnSignup" type="button">가입하기</button>
    <div class="login-links login-links--center">
      <button class="lk" id="btnBackIntro" type="button">뒤로가기</button>
    </div>
  </section>

  <footer class="login-footer">
    <div class="login-footer-links"><a href="ko/CustomerService.html">고객센터</a><span aria-hidden="true">|</span><span>한국어⌄</span></div>
    <p>© FP Patch Corp.</p>
  </footer>
</main>

<div id="popupRoot"></div>
<div id="toastRoot" aria-live="polite"></div>

<script src="js/Firebase.js"></script>
<script src="js/content-sanitizer.js"></script>
<script src="js/common.js"></script>
<script src="js/Login.js"></script>
</body>
</html>
