<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <base href="../" />
  <title>설정 — FPP v2</title>
  <meta name="description" content="FPP v2 사이트 설정" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0a1626" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="FPP" />
  <link rel="apple-touch-icon" href="img/pwa-icon-180.png" />
  <link rel="icon" type="image/png" href="img/logo-light.png" />
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('fpp_theme');
        var theme = saved ? JSON.parse(saved) : 'dark';
        document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <script>
    /* 설정 페이지는 모바일(SM/XS) 전용이다. PC(LG/MD) 직접 진입은 메인으로 돌린다. */
    (function () {
      var mobile = window.matchMedia
        ? window.matchMedia('(max-width: 767px)').matches
        : window.innerWidth <= 767;
      if (!mobile) window.location.replace('ko/Main.html#home');
    })();
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
  <link rel="stylesheet" href="css/common.css" />
  <link rel="stylesheet" href="css/Settings.css" />
</head>
<body class="settings-page">
  <main class="settings-shell">
    <header class="settings-header">
      <div class="settings-mobile-leading">
        <button class="settings-mobile-back" id="settingsMobileBack" type="button" aria-label="이전 페이지로 이동" hidden>
          <span class="top-menu-icon ic-v2-control-arrow-left-line" aria-hidden="true"></span>
        </button>
        <button class="settings-mobile-user is-loading" id="settingsMobileUser" type="button" aria-label="계정 정보를 불러오는 중" aria-busy="true" aria-disabled="true" tabindex="-1">
          <span class="skel settings-mobile-user-skeleton-avatar" aria-hidden="true"></span>
          <span class="skel settings-mobile-user-skeleton-name" aria-hidden="true"></span>
        </button>
      </div>
      <h1 class="settings-mobile-title" id="settingsMobileTitle" hidden>설정</h1>
      <div class="settings-mobile-actions">
        <button class="settings-mobile-action" id="settingsMobileSettings" type="button" aria-label="설정">
          <span class="top-menu-icon ic-v2-navigation-setting-fill" aria-hidden="true"></span>
        </button>
        <button class="settings-mobile-action" id="settingsMobileNotify" type="button" aria-label="알림">
          <span class="top-menu-icon ic-v2-navigation-alarm-fill" aria-hidden="true"></span>
        </button>
        <button class="settings-mobile-action" id="settingsMobileClose" type="button" aria-label="설정 닫기">
          <span class="top-menu-icon ic-v2-control-close-line" aria-hidden="true"></span>
        </button>
      </div>
    </header>

    <section class="settings-view is-active" id="settings-blank" data-view="blank" aria-hidden="false">
      <div class="settings-dashboard">
        <div class="settings-stats" aria-label="활동 통계" aria-busy="true">
          <div class="settings-stat"><strong id="dashboardPosts" aria-label="활동 통계를 불러오는 중"><span class="skel settings-stat-skeleton" aria-hidden="true"></span></strong><span>게시글</span></div>
          <div class="settings-stat"><strong id="dashboardComments" aria-label="활동 통계를 불러오는 중"><span class="skel settings-stat-skeleton" aria-hidden="true"></span></strong><span>댓글</span></div>
          <div class="settings-stat"><strong id="dashboardLikes" aria-label="활동 통계를 불러오는 중"><span class="skel settings-stat-skeleton" aria-hidden="true"></span></strong><span>좋아요</span></div>
        </div>

        <a class="settings-write-button is-loading" href="ko/Community.html#board" aria-busy="true" aria-disabled="true" aria-label="글쓰기 상태를 불러오는 중">
          <i class="settings-font-icon ic-v2-community-write-line" aria-hidden="true"></i>
          <span>글쓰기</span>
          <span class="skel settings-write-skeleton" aria-hidden="true"></span>
        </a>

        <section class="settings-favorites" aria-label="즐겨찾기">
          <h2>즐겨찾기</h2>
          <div class="settings-favorite-tabs" role="tablist" aria-label="즐겨찾기 종류">
            <button class="settings-favorite-tab is-on" type="button" role="tab" aria-selected="true" data-favorite-tab="char">캐릭터</button>
            <button class="settings-favorite-tab" type="button" role="tab" aria-selected="false" data-favorite-tab="support">현질 서폿 캐릭터</button>
          </div>
          <div class="settings-favorite-body" id="dashboardFavoriteBody"></div>
        </section>
      </div>
    </section>

    <section class="settings-view" id="settings-main" data-view="main" aria-hidden="true">
      <div class="settings-content">
        <div class="settings-list" aria-label="설정 메뉴">
          <button class="settings-row" type="button" data-open="myInfo">
            <span class="settings-row-icon settings-row-icon--info">
              <i class="settings-font-icon ic-v2-community-person-fill" aria-hidden="true"></i>
            </span>
            <span class="settings-row-copy"><strong>내 정보</strong><small>내 프로필과 계정 정보를 확인합니다.</small></span>
            <i class="settings-font-icon settings-row-arrow ic-v2-control-arrow-right-line" aria-hidden="true"></i>
          </button>
          <button class="settings-row" type="button" data-open="notify">
            <span class="settings-row-icon settings-row-icon--notify">
              <i class="settings-font-icon ic-v2-navigation-alarm-line" aria-hidden="true"></i>
            </span>
            <span class="settings-row-copy"><strong>알림</strong><small>받고 싶은 패치·댓글·이벤트 알림을 고릅니다.</small></span>
            <i class="settings-font-icon settings-row-arrow ic-v2-control-arrow-right-line" aria-hidden="true"></i>
          </button>
          <button class="settings-row" type="button" data-open="theme">
            <span class="settings-row-icon settings-row-icon--theme">
              <i class="settings-font-icon ic-v2-control-theme-device-fill" aria-hidden="true"></i>
            </span>
            <span class="settings-row-copy"><strong>테마</strong><small>FPP 화면을 밝게 또는 어둡게 표시합니다.</small></span>
            <span class="settings-row-value" id="themeSummary">다크 모드</span>
            <i class="settings-font-icon settings-row-arrow ic-v2-control-arrow-right-line" aria-hidden="true"></i>
          </button>
          <button class="settings-row" type="button" data-open="appIcon">
            <span class="settings-row-icon settings-row-icon--icon">
              <i class="settings-font-icon ic-v2-navigation-apps-fill" aria-hidden="true"></i>
            </span>
            <span class="settings-row-copy"><strong>앱 아이콘 변경</strong><small>홈 화면 바로가기에 사용할 로고를 선택합니다.</small></span>
            <span class="settings-row-value" id="iconSummary">다크 로고</span>
            <i class="settings-font-icon settings-row-arrow ic-v2-control-arrow-right-line" aria-hidden="true"></i>
          </button>
          <button class="settings-row" type="button" data-open="notice">
            <span class="settings-row-icon settings-row-icon--notice">
              <i class="settings-font-icon ic-v2-object-notice-line" aria-hidden="true"></i>
            </span>
            <span class="settings-row-copy"><strong>공지사항</strong><small>FPP의 새 소식과 업데이트를 확인합니다.</small></span>
            <i class="settings-font-icon settings-row-arrow ic-v2-control-arrow-right-line" aria-hidden="true"></i>
          </button>
          <a class="settings-row" href="ko/CustomerService.html">
            <span class="settings-row-icon settings-row-icon--support">
              <i class="settings-font-icon ic-v2-object-help-center-line" aria-hidden="true"></i>
            </span>
            <span class="settings-row-copy"><strong>고객센터</strong><small>자주 묻는 질문과 1:1 문의를 확인합니다.</small></span>
            <i class="settings-font-icon settings-row-arrow ic-v2-control-arrow-right-line" aria-hidden="true"></i>
          </a>
        </div>
      </div>
    </section>

    <section class="settings-view" id="settings-myInfo" data-view="myInfo" aria-hidden="true">
      <div class="settings-content settings-content--sub">
        <div class="settings-info-content" id="infoContent" hidden>
          <div class="settings-info-card" id="infoCard"></div>
          <button class="settings-info-logout" id="settingsInfoLogout" type="button">로그아웃</button>
          <div class="settings-info-delete-wrap">
            <button class="my-info-delete" id="settingsInfoDelete" type="button">회원 탈퇴 <span aria-hidden="true">›</span></button>
          </div>
        </div>
      </div>
    </section>

    <section class="settings-view" id="settings-profileInfo" data-view="profileInfo" aria-hidden="true">
      <div class="settings-content settings-content--profile">
        <div class="settings-profile-layout settings-profile-skeleton" id="profileSettingsLoading" hidden aria-hidden="true">
          <div class="profile-preview-card">
            <div class="profile-cover"><span class="skel"></span></div>
            <div class="profile-card-info">
              <div class="profile-card-avatar"><span class="skel"></span></div>
              <span class="skel settings-profile-skeleton-name"></span>
              <div class="profile-card-stats">
                <div><span class="skel settings-profile-skeleton-stat"></span><span class="skel settings-profile-skeleton-stat-label"></span></div>
                <div><span class="skel settings-profile-skeleton-stat"></span><span class="skel settings-profile-skeleton-stat-label"></span></div>
                <div><span class="skel settings-profile-skeleton-stat"></span><span class="skel settings-profile-skeleton-stat-label"></span></div>
              </div>
            </div>
          </div>
          <div class="settings-profile-fields">
            <div class="profile-field"><span class="skel settings-profile-skeleton-label"></span><span class="skel settings-profile-skeleton-action"></span></div>
            <div class="profile-field"><span class="skel settings-profile-skeleton-label"></span><span class="skel settings-profile-skeleton-input"></span></div>
            <span class="skel settings-profile-skeleton-save"></span>
          </div>
        </div>
        <div class="settings-profile-layout" id="profileSettingsForm" hidden>
          <div class="profile-preview-card">
            <div class="profile-cover"><img id="profileSettingCover" src="img/avatars/ace.png" alt=""></div>
            <div class="profile-card-info">
              <div class="profile-card-avatar">
                <img id="profileSettingAvatar" src="img/avatars/ace.png" alt="프로필 이미지">
              </div>
              <b class="profile-card-name" id="profileSettingName">선원</b>
              <div class="profile-card-stats" id="profileSettingStats">
                <div><b id="profilePosts">0</b><small>게시글</small></div>
                <div><b id="profileComments">0</b><small>댓글</small></div>
                <div><b id="profileLikes">0</b><small>좋아요</small></div>
              </div>
            </div>
          </div>
          <div class="settings-profile-fields">
            <div class="profile-field">
              <label>프로필 이미지</label>
              <button class="profile-image-register" id="settingsProfileImage" type="button">
                <i class="settings-font-icon ic-v2-media-image-camera-line" aria-hidden="true"></i>
                이미지 등록
              </button>
            </div>
            <div class="profile-field">
              <label for="settingsProfileNickname">닉네임</label>
              <div class="profile-input-wrap">
                <input id="settingsProfileNickname" type="text" maxlength="20" autocomplete="nickname" placeholder="닉네임을 입력하세요">
              </div>
            </div>
            <button class="settings-profile-save" id="settingsProfileSave" type="button" disabled>변경사항 저장</button>
          </div>
        </div>
      </div>
    </section>

    <section class="settings-view" id="settings-notice" data-view="notice" aria-hidden="true">
      <div class="settings-content settings-content--sub">
          <div class="notice-list" id="noticeList" aria-busy="true">
            <div class="notice-skeleton-list" aria-hidden="true">
              <div class="notice-skeleton-row"><div class="notice-skeleton-title"><span class="skel notice-skeleton-badge"></span><span class="skel notice-skeleton-heading"></span></div><span class="skel notice-skeleton-meta"></span></div>
              <div class="notice-skeleton-row"><div class="notice-skeleton-title"><span class="skel notice-skeleton-badge"></span><span class="skel notice-skeleton-heading"></span></div><span class="skel notice-skeleton-meta"></span></div>
              <div class="notice-skeleton-row"><div class="notice-skeleton-title"><span class="skel notice-skeleton-badge"></span><span class="skel notice-skeleton-heading"></span></div><span class="skel notice-skeleton-meta"></span></div>
              <div class="notice-skeleton-row"><div class="notice-skeleton-title"><span class="skel notice-skeleton-badge"></span><span class="skel notice-skeleton-heading"></span></div><span class="skel notice-skeleton-meta"></span></div>
            </div>
          </div>
        <article class="notice-detail" id="noticeDetail" hidden>
          <button class="inline-back" id="noticeDetailBack" type="button">
            <i class="settings-font-icon ic-v2-control-arrow-left-line" aria-hidden="true"></i> 목록으로
          </button>
          <div class="notice-detail-meta" id="noticeDetailMeta"></div>
          <h3 id="noticeDetailTitle"></h3>
          <div class="notice-detail-content" id="noticeDetailContent"></div>
        </article>
      </div>
    </section>

    <section class="settings-view" id="settings-notify" data-view="notify" aria-hidden="true">
      <div class="settings-content settings-content--sub">
        <div class="settings-choice-card" id="notifyCard" hidden></div>
      </div>
    </section>

    <section class="settings-view" id="settings-notifications" data-view="notifications" aria-hidden="true">
      <div class="settings-content settings-content--sub">
        <div id="notificationsContent" hidden>
          <div class="profile-notify-filters" role="tablist" aria-label="알림 종류">
            <button class="profile-notify-filter is-on" type="button" data-settings-notify-filter="all" role="tab" aria-selected="true">전체 알림</button>
            <button class="profile-notify-filter" type="button" data-settings-notify-filter="unread" role="tab" aria-selected="false">읽지 않음</button>
            <button class="profile-notify-filter" type="button" data-settings-notify-filter="read" role="tab" aria-selected="false">읽은 알림</button>
          </div>
          <div class="profile-notification-list settings-notification-list" id="settingsNotificationList" role="tabpanel" aria-live="polite"></div>
        </div>
      </div>
    </section>

    <section class="settings-view" id="settings-theme" data-view="theme" aria-hidden="true">
      <div class="settings-content settings-content--sub">
        <div class="theme-options" role="radiogroup" aria-label="테마 선택">
          <button class="theme-option" type="button" data-theme-choice="light" role="radio" aria-checked="false">
            <span class="theme-preview theme-preview--light"><i></i><b></b><em></em></span>
            <span><strong>라이트 모드</strong><small>밝고 선명한 화면</small></span><i class="choice-check"></i>
          </button>
          <button class="theme-option" type="button" data-theme-choice="dark" role="radio" aria-checked="false">
            <span class="theme-preview theme-preview--dark"><i></i><b></b><em></em></span>
            <span><strong>다크 모드</strong><small>눈이 편안한 어두운 화면</small></span><i class="choice-check"></i>
          </button>
        </div>
      </div>
    </section>

    <section class="settings-view" id="settings-appIcon" data-view="appIcon" aria-hidden="true">
      <div class="settings-content settings-content--sub">
        <div class="icon-options" role="radiogroup" aria-label="앱 아이콘 선택">
          <button class="icon-option" type="button" data-icon-choice="logo-dark" role="radio" aria-checked="false">
            <span class="icon-preview icon-preview--dark"><img src="img/logo-dark.png" alt="" /></span><span><strong>다크 로고</strong><small>어두운 배경에 잘 어울립니다.</small></span><i class="choice-check"></i>
          </button>
          <button class="icon-option" type="button" data-icon-choice="logo-light" role="radio" aria-checked="false">
            <span class="icon-preview icon-preview--light"><img src="img/logo-light.png" alt="" /></span><span><strong>라이트 로고</strong><small>밝은 배경에 잘 어울립니다.</small></span><i class="choice-check"></i>
          </button>
        </div>
        <div class="install-card">
          <span class="install-card-icon"><i class="settings-font-icon ic-v2-object-download-line" aria-hidden="true"></i></span>
          <div><strong>홈 화면에 추가</strong><p>아이콘 선택 후 브라우저 메뉴에서 홈 화면에 추가를 선택하세요.</p></div>
          <button id="installShortcut" type="button" aria-label="홈 화면에 추가">추가</button>
        </div>
      </div>
    </section>

    <div class="settings-toast" id="settingsToast" role="status" aria-live="polite"></div>
    <div class="settings-auth-gate" id="settingsAuthGate" hidden aria-hidden="true">
      <section class="settings-auth-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsAuthTitle" aria-describedby="settingsAuthMessage">
        <span class="settings-auth-icon"><i class="settings-font-icon ic-v2-navigation-login-line" aria-hidden="true"></i></span>
        <strong id="settingsAuthTitle">로그인이 필요합니다.</strong>
        <p id="settingsAuthMessage">로그인 후 이용해 주세요.</p>
        <a class="settings-action-button" id="settingsAuthLogin" href="ko/Login.html">로그인하기</a>
      </section>
    </div>
    <div class="settings-avatar-overlay" id="settingsAvatarOverlay" hidden>
      <section class="settings-avatar-picker" role="dialog" aria-modal="true" aria-labelledby="settingsAvatarTitle">
        <header class="settings-avatar-header">
          <h2 id="settingsAvatarTitle">프로필 이미지 등록</h2>
          <button class="settings-avatar-close" id="settingsAvatarClose" type="button" aria-label="닫기">×</button>
        </header>
        <div class="settings-avatar-preview"><img id="settingsAvatarPreview" src="img/avatars/ace.png" alt="선택한 프로필 이미지"></div>
        <div class="settings-avatar-grid" id="settingsAvatarGrid"></div>
        <footer class="settings-avatar-footer">
          <button class="settings-avatar-cancel" id="settingsAvatarCancel" type="button">취소</button>
          <button class="settings-avatar-register" id="settingsAvatarRegister" type="button">등록</button>
        </footer>
      </section>
    </div>
  </main>
  <script src="js/Firebase.js"></script>
  <script src="js/content-sanitizer.js"></script>
  <script src="js/Settings.js"></script>
</body>
</html>
